name: Build & Deploy to Somee.com

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet publish -f net8.0 -c Release -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: publish/

      - name: 1. Take app offline (upload app_offline.htm)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .github/ftp-offline/
          server-dir: ${{ secrets.FTP_PATH }}/
          dangerous-clean-slate: false

      - name: 2. Wait for app to stop
        shell: pwsh
        run: Start-Sleep -Seconds 10

      - name: 3. Upload new build (clean slate, preserve db)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: publish/
          server-dir: ${{ secrets.FTP_PATH }}/
          dangerous-clean-slate: true
          exclude: pharmacy_wms.db

      - name: 4. Bring app online (delete app_offline.htm)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .github/ftp-online/
          server-dir: ${{ secrets.FTP_PATH }}/
          exclude: .gitkeep
          dangerous-clean-slate: false
