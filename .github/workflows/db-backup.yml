name: Database Backup to S3

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2:00 AM UTC
  workflow_dispatch: # Allows triggering backups manually via GitHub Actions UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run pg_dump
        run: |
          pg_dump "${{ secrets.DB_BACKUP_URL }}" -F c -b -v -f backup.dump

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload Backup to S3
        run: |
          DATE=$(date +%Y_%m_%d_%H%M%S)
          aws s3 cp backup.dump s3://${{ secrets.AWS_S3_BUCKET }}/backups/db_backup_$DATE.dump
