services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharmacy_wms
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy_wms"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "10000:10000"
    environment:
      DATABASE_URL: "Host=postgres;Port=5432;Database=pharmacy_wms;Username=pharmacy;Password=pharmacy;SSL Mode=Disable"
      Jwt__Key: "dev-secret-key-that-is-at-least-32-chars-long!!"
      Jwt__Issuer: "PharmacyWMS"
      Jwt__Audience: "PharmacyWMS"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.local.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
